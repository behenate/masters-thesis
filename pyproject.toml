[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-dataset-tools"
version = "0.1.0"
description = "Dataset download and combination utilities for the spam and phishing thesis project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pyarrow",
  "requests",
]

[project.scripts]
aim-master-merge = "aim_master.merge_repos:main"
aim-master-export = "aim_master.export_metrics:main"

[project.optional-dependencies]
aim-master = [
  "aim",
  "pandas",
  "prompt_toolkit",
]

aim-tracking = [
  "aim",
  "scikit-learn",
  "tensorboard",
]

lora-fine-tuning = [
  "ipywidgets",
  "accelerate",
  "aim",
  "datasets",
  "ipykernel",
  "jupyterlab",
  "numpy",
  "peft",
  "scikit-learn",
  "tensorboard",
  "torch",
  "transformers",
  "bitsandbytes",
]

[tool.setuptools.packages.find]
include = ["aim_master*", "aim_tracking*", "dataset*"]
